<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="asg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a66b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="430" rx="14" fill="#f7f9fb" stroke="#e2e8f0"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#16324f">SE-ResNet — compact Squeeze-and-Excitation residual network</text>

  <!-- backbone chain -->
  <g font-size="10.5">
    <rect x="24" y="62" width="100" height="62" rx="8" fill="#eef4fa" stroke="#16324f" stroke-width="1.4"/>
    <text x="74" y="86" font-weight="700" fill="#16324f" text-anchor="middle">Input</text>
    <text x="74" y="104" fill="#64748b" text-anchor="middle">64×250×1</text>

    <rect x="136" y="62" width="100" height="62" rx="8" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.3"/>
    <text x="186" y="82" font-weight="700" fill="#16324f" text-anchor="middle">Stem</text>
    <text x="186" y="99" fill="#64748b" text-anchor="middle">Conv 5×5 /2</text>
    <text x="186" y="114" fill="#64748b" text-anchor="middle">BN·ReLU·Pool/2</text>

    <rect x="248" y="62" width="100" height="62" rx="8" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.3"/>
    <text x="298" y="86" font-weight="700" fill="#16324f" text-anchor="middle">Stage 0</text>
    <text x="298" y="104" fill="#64748b" text-anchor="middle">2× SE-Res · 32</text>

    <rect x="360" y="62" width="100" height="62" rx="8" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.3"/>
    <text x="410" y="82" font-weight="700" fill="#16324f" text-anchor="middle">Stage 1</text>
    <text x="410" y="99" fill="#64748b" text-anchor="middle">2× SE-Res · 64</text>
    <text x="410" y="114" fill="#8a5e13" text-anchor="middle">↓2</text>

    <rect x="472" y="62" width="100" height="62" rx="8" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.3"/>
    <text x="522" y="82" font-weight="700" fill="#16324f" text-anchor="middle">Stage 2</text>
    <text x="522" y="99" fill="#64748b" text-anchor="middle">2× SE-Res · 128</text>
    <text x="522" y="114" fill="#8a5e13" text-anchor="middle">↓2</text>

    <rect x="584" y="62" width="100" height="62" rx="8" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.3"/>
    <text x="634" y="82" font-weight="700" fill="#16324f" text-anchor="middle">Stage 3</text>
    <text x="634" y="99" fill="#64748b" text-anchor="middle">2× SE-Res · 256</text>
    <text x="634" y="114" fill="#8a5e13" text-anchor="middle">↓2</text>

    <rect x="696" y="62" width="100" height="62" rx="8" fill="#eef4fa" stroke="#16324f" stroke-width="1.4"/>
    <text x="746" y="82" font-weight="700" fill="#16324f" text-anchor="middle">GAP</text>
    <text x="746" y="99" fill="#64748b" text-anchor="middle">global avg pool</text>
    <text x="746" y="114" fill="#64748b" text-anchor="middle">= embedding</text>

    <rect x="808" y="62" width="88" height="62" rx="8" fill="#eef4fa" stroke="#16324f" stroke-width="1.4"/>
    <text x="852" y="82" font-weight="700" fill="#16324f" text-anchor="middle">Dropout</text>
    <text x="852" y="99" fill="#64748b" text-anchor="middle">→ Softmax</text>
    <text x="852" y="114" fill="#64748b" text-anchor="middle">n classes</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#as)">
    <line x1="124" y1="93" x2="134" y2="93"/><line x1="236" y1="93" x2="246" y2="93"/>
    <line x1="348" y1="93" x2="358" y2="93"/><line x1="460" y1="93" x2="470" y2="93"/>
    <line x1="572" y1="93" x2="582" y2="93"/><line x1="684" y1="93" x2="694" y2="93"/>
    <line x1="796" y1="93" x2="806" y2="93"/>
  </g>

  <!-- zoom connector -->
  <path d="M298,124 L298,150 L250,150 L250,168" fill="none" stroke="#9fb6ca" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#as)"/>
  <text x="300" y="146" font-size="10.5" fill="#7a8795">zoom into one SE-residual block ↓</text>

  <!-- SE residual block detail panel -->
  <rect x="24" y="168" width="872" height="246" rx="10" fill="#fbfcfe" stroke="#2c6e9b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="44" y="192" font-size="13.5" font-weight="700" fill="#16324f">SE-residual block (pre-activation) — the unit repeated in every stage</text>

  <!-- residual chain -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="44" y="226" width="64" height="34" rx="7" fill="#eef4fa" stroke="#16324f" stroke-width="1.2"/><text x="76" y="247" font-weight="700" fill="#16324f">x (in)</text>
    <rect x="128" y="226" width="56" height="34" rx="7" fill="#fff" stroke="#9fb6ca"/><text x="156" y="247" fill="#44525f">BN</text>
    <rect x="204" y="226" width="56" height="34" rx="7" fill="#fff" stroke="#9fb6ca"/><text x="232" y="247" fill="#44525f">ReLU</text>
    <rect x="280" y="226" width="78" height="34" rx="7" fill="#fff" stroke="#2c6e9b"/><text x="319" y="247" fill="#16324f">Conv 3×3</text>
    <rect x="378" y="226" width="56" height="34" rx="7" fill="#fff" stroke="#9fb6ca"/><text x="406" y="247" fill="#44525f">BN</text>
    <rect x="454" y="226" width="56" height="34" rx="7" fill="#fff" stroke="#9fb6ca"/><text x="482" y="247" fill="#44525f">ReLU</text>
    <rect x="530" y="226" width="78" height="34" rx="7" fill="#fff" stroke="#2c6e9b"/><text x="569" y="247" fill="#16324f">Conv 3×3</text>
    <rect x="628" y="226" width="72" height="34" rx="7" fill="#f0f7f1" stroke="#58a66b" stroke-width="1.3"/><text x="664" y="247" font-weight="700" fill="#2f6b40">SE gate</text>
    <circle cx="742" cy="243" r="17" fill="#eef4fa" stroke="#16324f" stroke-width="1.3"/><text x="742" y="248" font-size="15" font-weight="700" fill="#16324f">+</text>
    <rect x="788" y="226" width="64" height="34" rx="7" fill="#eef4fa" stroke="#16324f" stroke-width="1.2"/><text x="820" y="247" font-weight="700" fill="#16324f">out</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.4" marker-end="url(#as)">
    <line x1="108" y1="243" x2="126" y2="243"/><line x1="184" y1="243" x2="202" y2="243"/>
    <line x1="260" y1="243" x2="278" y2="243"/><line x1="358" y1="243" x2="376" y2="243"/>
    <line x1="434" y1="243" x2="452" y2="243"/><line x1="510" y1="243" x2="528" y2="243"/>
    <line x1="608" y1="243" x2="626" y2="243"/><line x1="700" y1="243" x2="723" y2="243"/>
    <line x1="759" y1="243" x2="786" y2="243"/>
  </g>
  <!-- identity skip -->
  <path d="M76,226 C76,207 742,207 742,224" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#as)"/>
  <text x="118" y="210" font-size="10.5" fill="#64748b" text-anchor="start">identity skip · 1×1 conv when shape changes</text>

  <!-- SE gate internals -->
  <path d="M664,260 L664,286" fill="none" stroke="#58a66b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#asg)"/>
  <rect x="150" y="290" width="640" height="104" rx="9" fill="#f0f7f1" stroke="#58a66b" stroke-width="1.1"/>
  <text x="170" y="312" font-size="12" font-weight="700" fill="#2f6b40">SE gate — channel attention</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="170" y="330" width="96" height="40" rx="7" fill="#fff" stroke="#58a66b"/><text x="218" y="348" fill="#2f6b40">Global</text><text x="218" y="362" fill="#2f6b40">AvgPool</text>
    <rect x="296" y="330" width="120" height="40" rx="7" fill="#fff" stroke="#58a66b"/><text x="356" y="348" fill="#2f6b40">Dense C/8</text><text x="356" y="362" fill="#2f6b40">ReLU</text>
    <rect x="446" y="330" width="130" height="40" rx="7" fill="#fff" stroke="#58a66b"/><text x="511" y="348" fill="#2f6b40">Dense C</text><text x="511" y="362" fill="#2f6b40">sigmoid</text>
    <rect x="606" y="330" width="160" height="40" rx="7" fill="#fff" stroke="#58a66b"/><text x="686" y="348" fill="#2f6b40">channel-wise</text><text x="686" y="362" fill="#2f6b40">re-scale ⊗</text>
  </g>
  <g stroke="#58a66b" stroke-width="1.4" marker-end="url(#asg)">
    <line x1="266" y1="350" x2="294" y2="350"/><line x1="416" y1="350" x2="444" y2="350"/>
    <line x1="576" y1="350" x2="604" y2="350"/>
  </g>
</svg>
