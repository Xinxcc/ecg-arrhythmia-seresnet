<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ae" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="300" rx="14" fill="#f7f9fb" stroke="#e2e8f0"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#16324f">ECG arrhythmia classification — signal to 4-class rhythm</text>

  <!-- Row 1: signal -> features -->
  <g>
    <rect x="30" y="62" width="196" height="72" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="128" y="92" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">raw single-lead ECG</text>
    <text x="128" y="113" font-size="11.5" fill="#64748b" text-anchor="middle">300 Hz · PhysioNet/CinC 2017</text>

    <rect x="256" y="62" width="196" height="72" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="354" y="92" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">band-pass + normalize</text>
    <text x="354" y="113" font-size="11.5" fill="#64748b" text-anchor="middle">Butterworth 0.5–40 Hz · z-score</text>

    <rect x="482" y="62" width="196" height="72" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="580" y="92" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">window + augment</text>
    <text x="580" y="113" font-size="11.5" fill="#64748b" text-anchor="middle">fixed length · noise / time-shift</text>

    <rect x="708" y="62" width="196" height="72" rx="9" fill="#eef4fa" stroke="#16324f" stroke-width="1.5"/>
    <text x="806" y="92" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">log-Mel feature</text>
    <text x="806" y="113" font-size="11.5" fill="#64748b" text-anchor="middle">64 mel bins × 250 frames</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ae)">
    <line x1="226" y1="98" x2="254" y2="98"/>
    <line x1="452" y1="98" x2="480" y2="98"/>
    <line x1="678" y1="98" x2="706" y2="98"/>
  </g>
  <!-- down arrow -->
  <path d="M806,134 L806,150 L128,150 L128,172" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ae)"/>

  <!-- Row 2: model + transfer + eval -->
  <rect x="30" y="180" width="196" height="76" rx="9" fill="#eef4fa" stroke="#16324f" stroke-width="1.5"/>
  <text x="128" y="212" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">SE-ResNet backbone</text>
  <text x="128" y="233" font-size="11.5" fill="#64748b" text-anchor="middle">stem → 4 SE-residual stages → GAP</text>

  <!-- two-stage transfer group -->
  <rect x="246" y="168" width="432" height="100" rx="10" fill="#f0f7f1" stroke="#58a66b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="462" y="186" font-size="11.5" font-weight="700" fill="#3f7a4f" text-anchor="middle">two-stage transfer learning (handles class imbalance)</text>
  <rect x="260" y="196" width="196" height="58" rx="8" fill="#ffffff" stroke="#58a66b" stroke-width="1.3"/>
  <text x="358" y="221" font-size="12.5" font-weight="700" fill="#2f6b40" text-anchor="middle">Stage 1 · pre-train</text>
  <text x="358" y="240" font-size="11" fill="#5f7a67" text-anchor="middle">binary head — Normal vs AF</text>
  <rect x="468" y="196" width="196" height="58" rx="8" fill="#ffffff" stroke="#58a66b" stroke-width="1.3"/>
  <text x="566" y="221" font-size="12.5" font-weight="700" fill="#2f6b40" text-anchor="middle">Stage 2 · fine-tune</text>
  <text x="566" y="240" font-size="11" fill="#5f7a67" text-anchor="middle">4-class · class weights · LR plateau</text>

  <rect x="708" y="180" width="196" height="76" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
  <text x="806" y="206" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">evaluation</text>
  <text x="806" y="226" font-size="11.5" fill="#64748b" text-anchor="middle">macro-F1 · per-class F1</text>
  <text x="806" y="243" font-size="11.5" fill="#64748b" text-anchor="middle">confusion matrix</text>

  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ae)">
    <line x1="226" y1="218" x2="258" y2="222"/>
    <line x1="456" y1="225" x2="466" y2="225"/>
    <line x1="678" y1="218" x2="706" y2="218"/>
  </g>
  <text x="30" y="288" font-size="11.5" fill="#64748b">4 classes: Normal · Atrial Fibrillation · Other rhythm · Noisy — the single-lead ECG is treated as an audio-like signal.</text>
</svg>
